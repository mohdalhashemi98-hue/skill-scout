# =============================================================================
# Skill Scout - Production Docker Compose
# =============================================================================
# Services:
#   - n8n:         Workflow automation (queue mode with Redis)
#   - postgres:    PostgreSQL 16 database for n8n internal data
#   - redis:       Queue backend for n8n scaling and job management
#   - traefik:     Reverse proxy with automatic Let's Encrypt SSL
#   - uptime-kuma: Service monitoring dashboard
#
# Usage:
#   cp .env.example .env   # Fill in all values
#   docker compose up -d   # Start all services
#   docker compose logs -f # Follow logs
#
# Prerequisites:
#   - Docker Engine 24+ and Docker Compose v2
#   - A domain name pointed to your server's IP
#   - Ports 80 and 443 open for Traefik
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Traefik - Reverse Proxy with Auto SSL
  # ---------------------------------------------------------------------------
  # Handles TLS termination, automatic certificate renewal via Let's Encrypt,
  # and routes traffic to n8n and Uptime Kuma based on hostname.
  traefik:
    image: traefik:v3.0
    container_name: skillscout-traefik
    restart: unless-stopped
    command:
      # Enable the dashboard (protected by basicauth in production)
      - "--api.dashboard=true"
      # Docker provider: auto-discover services via labels
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=skillscout-public"
      # HTTP entrypoint (redirects to HTTPS)
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # HTTPS entrypoint
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certResolver=letsencrypt"
      # Let's Encrypt certificate resolver
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Logging
      - "--log.level=WARN"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
      - traefik-logs:/var/log/traefik
    networks:
      - skillscout-public
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 - n8n Database
  # ---------------------------------------------------------------------------
  # Stores n8n workflow definitions, credentials, execution history, and
  # user accounts. This is NOT the Supabase database (that's hosted separately).
  postgres:
    image: postgres:16-alpine
    container_name: skillscout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Performance tuning for a dedicated n8n database
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - skillscout-internal
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis - Queue Backend for n8n
  # ---------------------------------------------------------------------------
  # Required for n8n queue mode. Manages job distribution across n8n worker
  # processes and provides pub/sub for real-time execution updates.
  redis:
    image: redis:7-alpine
    container_name: skillscout-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    networks:
      - skillscout-internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # n8n - Workflow Automation Engine (Main Instance)
  # ---------------------------------------------------------------------------
  # Runs in queue mode for production scalability. The main process handles
  # the UI, webhook reception, and scheduling. Workers (below) execute the
  # actual workflow logic.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: skillscout-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # --- Core Configuration ---
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/

      # --- Execution Mode ---
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_BULL_REDIS_DB: 0

      # --- Database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- Security ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      # --- Execution Settings ---
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 720

      # --- External Services (passed to workflows as env vars) ---
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      CLIENT_API_KEY: ${CLIENT_API_KEY}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_FILES_DIR: /data/client-files

      # --- Timezone ---
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - n8n-data:/home/node/.n8n
      - client-files:/data/client-files
    networks:
      - skillscout-internal
      - skillscout-public
    labels:
      # Traefik routing: n8n UI and webhooks
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_HOST}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # n8n Worker - Executes Workflows in Queue Mode
  # ---------------------------------------------------------------------------
  # Separate worker process that picks up jobs from Redis and executes them.
  # Scale this service horizontally for higher throughput:
  #   docker compose up -d --scale n8n-worker=3
  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: skillscout-n8n-worker
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    command: worker
    environment:
      # Workers share the same config as the main n8n instance
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_BULL_REDIS_DB: 0
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      CLIENT_API_KEY: ${CLIENT_API_KEY}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_FILES_DIR: /data/client-files
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - n8n-data:/home/node/.n8n
      - client-files:/data/client-files
    networks:
      - skillscout-internal
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Uptime Kuma - Monitoring Dashboard
  # ---------------------------------------------------------------------------
  # Provides uptime monitoring for n8n, Supabase, and external services.
  # Supports notifications via Telegram, Slack, email, and more.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: skillscout-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - skillscout-internal
      - skillscout-public
    labels:
      # Traefik routing: monitoring dashboard
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`${MONITORING_HOST}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/status-page/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# =============================================================================
# Networks
# =============================================================================
networks:
  # Public network: services that need to be accessed via Traefik
  skillscout-public:
    driver: bridge
    name: skillscout-public

  # Internal network: database and Redis (not exposed to the internet)
  skillscout-internal:
    driver: bridge
    name: skillscout-internal
    internal: true

# =============================================================================
# Volumes - Persistent data storage
# =============================================================================
volumes:
  # PostgreSQL data (n8n workflows, credentials, execution history)
  postgres-data:
    driver: local

  # Redis data (queue state, append-only file)
  redis-data:
    driver: local

  # n8n configuration and custom nodes
  n8n-data:
    driver: local

  # Client files for delivery via bots
  client-files:
    driver: local

  # Traefik Let's Encrypt certificates
  traefik-certs:
    driver: local

  # Traefik access logs
  traefik-logs:
    driver: local

  # Uptime Kuma monitoring data
  uptime-kuma-data:
    driver: local
